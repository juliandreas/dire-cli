# Files configuration
[files]
# Where to find translation files
directory = "demo"

# Map file names/patterns to languages
[files.locales]
"en.json" = "en-US"
"sv.json" = "sv-SE"
"da.json" = "da-DK"

# Translation providers configuration
[providers]
# Specify which provider to use
active = "openai"

# Define LLM providers you want to have available
[[providers.configuration]]
name = "openai"
model = "gpt-4.1-nano"
maxTokens = 32000
temperature = 0.2

[[providers.configuration]]
name = "claude"
model = "claude-3-5-haiku-latest"
maxTokens = 8192
temperature = 0.2

[[providers.configuration]]
name = "gemini"
model = "gemini-2.5-flash"
maxTokens = 32000
temperature = 0.2

[[providers.configuration]]
name = "mistral"
model = "mistral-small-latest"
maxTokens = 32000
temperature = 0.2

[[providers.configuration]]
name = "deepseek"
model = "deepseek-chat"
maxTokens = 8192
temperature = 0.2

# Project context
[project]
name = "E-commerce Platform"
description = "Online shopping platform with user accounts, product catalog, and order management"
domain = "e-commerce"

# Style guide configuration
[styleGuide]
# Translation formality (optional, defaults to "automatic")
formality = "automatic" # automatic | formal | informal

# Glossary configuration
[glossary]
autoSort = true
